<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>iPhone</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
 --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;
 --bg:#000;--g1:#1c1c1e;--g2:#2c2c2e;--g3:#3a3a3c;--sep:rgba(84,84,88,.6);
 --lb:#fff;--lb2:rgba(235,235,245,.6);--lb3:rgba(235,235,245,.3);
 --blue:#0a84ff;--green:#30d158;--red:#ff453a;--yellow:#ffd60a;--orange:#ff9f0a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#000}
body{font-family:var(--sf);color:var(--lb);font-size:17px;letter-spacing:-.022em;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.phone{position:relative;width:100%;height:100%;max-width:430px;max-height:932px;background:#000;overflow:hidden;touch-action:none}
@media(min-width:520px){.phone{height:min(932px,94vh);border-radius:55px;box-shadow:0 0 0 11px #1a1a1c,0 0 0 13px #3a3a3e,0 40px 90px rgba(0,0,0,.8)}}
.scr{position:absolute;inset:0;overflow:hidden}
.off{opacity:0;pointer-events:none}

/* status bar + island */
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0 34px;z-index:80;pointer-events:none;color:#fff;transition:color .3s}
.sb.dark{color:#000}
.sb .t{font-size:17px;font-weight:600;letter-spacing:-.01em;width:60px}
.sb .ri{display:flex;align-items:center;gap:6px}
.isl{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:90}
.batt{position:relative;width:27px;height:13px;border:1.2px solid currentColor;border-radius:4px;opacity:.95;display:flex;align-items:center;padding:1.5px}
.batt:after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:4px;border-radius:0 2px 2px 0;background:currentColor;opacity:.5}
.batt i{display:block;height:100%;width:14%;background:var(--red);border-radius:2px}
.batt b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}

/* lock */
#lock{z-index:60;background:#000;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .4s}
#lock.up{transform:translateY(-100%)}
#lock .wp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
#lock .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 50%,rgba(0,0,0,.45))}
.lk{position:absolute;left:0;right:0;top:68px;text-align:center;color:#fff}
.lk .ic{font-size:13px;opacity:.9;display:flex;justify-content:center;margin-bottom:6px}
.lk .d{font-size:21px;font-weight:600;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.lk .tm{font-size:104px;font-weight:600;line-height:.98;letter-spacing:-.035em;text-shadow:0 2px 20px rgba(0,0,0,.25);font-feature-settings:"tnum"}
.ntfs{position:absolute;left:10px;right:10px;bottom:120px}
.nt{display:flex;gap:11px;padding:12px 14px;margin-top:8px;border-radius:22px;background:rgba(30,30,32,.55);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);color:#fff;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.nt:nth-child(2){animation-delay:.12s}.nt:nth-child(3){animation-delay:.24s}
.nt .ai{flex:none;width:38px;height:38px}
.nt .tx{flex:1;min-width:0}
.nt .h{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.nt .h span{font-weight:400;font-size:13px;opacity:.6}
.nt .m{font-size:15px;line-height:1.3;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lkb{position:absolute;bottom:52px;width:50px;height:50px;border-radius:50%;background:rgba(30,30,32,.45);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center}
.lkb.l{left:46px}.lkb.r{right:46px}
.ind{position:absolute;left:50%;bottom:8px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#fff;z-index:85;cursor:pointer}
.ind.dk{background:#000}
.swh{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;color:rgba(255,255,255,.8);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

/* passcode */
#pass{z-index:70;display:flex;flex-direction:column;align-items:center;padding-top:118px;color:#fff;transition:opacity .3s}
#pass .bgi{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(30px) brightness(.55) saturate(1.3);z-index:-1}
#pass .tt{font-size:20px;font-weight:500}
#pass .hn{font-size:14px;opacity:.65;height:20px;margin-top:6px}
.dots{display:flex;gap:22px;margin:20px 0 52px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.4px solid #fff;transition:background .1s}
.dots i.on{background:#fff}
.dots.no{animation:shake .45s}
@keyframes shake{15%,55%{transform:translateX(-14px)}35%,75%{transform:translateX(14px)}}
.kp{display:grid;grid-template-columns:repeat(3,80px);gap:15px 25px}
.kp button{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.17);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s}
.kp button:active{background:rgba(255,255,255,.5)}
.kp button b{font-size:36px;font-weight:400;line-height:1}
.kp button small{font-size:10px;font-weight:600;letter-spacing:.18em;margin-top:2px}
.kp .no{background:none;visibility:hidden}
.pbot{position:absolute;bottom:46px;left:52px;right:52px;display:flex;justify-content:space-between;font-size:17px}

/* home */
#home{z-index:10;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s}
#home.bk{transform:scale(.92);filter:brightness(.6)}
#home .wp{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(22px) brightness(.62) saturate(1.2)}
.hw{position:absolute;left:0;right:0;top:66px;padding:0 24px}
.wids{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:18px}
.wd{aspect-ratio:1/1;border-radius:22px;padding:14px 15px;position:relative;overflow:hidden}
.wd.we{background:linear-gradient(180deg,#2a6fd6,#5ea0ef)}
.wd.we .c{font-size:15px;font-weight:600}
.wd.we .tp{font-size:46px;font-weight:300;line-height:1.05;letter-spacing:-.03em}
.wd.we .s{position:absolute;left:15px;bottom:13px;font-size:13px;font-weight:600;line-height:1.3}
.wd.we .s span{display:block;font-weight:500;opacity:.9}
.wd.ca{background:#fff;color:#000}
.wd.ca .w{font-size:12px;font-weight:700;color:var(--red);letter-spacing:.02em}
.wd.ca .n{font-size:40px;font-weight:300;line-height:1.05;letter-spacing:-.03em}
.wd.ca .ev{margin-top:6px;border-left:3px solid var(--orange);padding-left:7px}
.wd.ca .ev b{display:block;font-size:12px;font-weight:700;line-height:1.25;color:#1c1c1e}
.wd.ca .ev span{display:block;font-size:11px;color:#8e8e93}
.wlb{text-align:center;font-size:12px;font-weight:500;margin-top:-12px;margin-bottom:10px;color:rgba(255,255,255,.9)}
.wlbs{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;width:72px}
.ai{position:relative;width:62px;height:62px;border-radius:14px;overflow:visible;transition:transform .12s}
.ai>svg{width:100%;height:100%;border-radius:14px}
.app:active .ai{transform:scale(.9);filter:brightness(.8)}
.app .n{font-size:12px;color:#fff;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap}
.bdg{position:absolute;top:-7px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 7px;z-index:2}
.srchp{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:15px;background:rgba(120,120,128,.36);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;font-weight:600;color:#fff}
.dock{position:absolute;left:10px;right:10px;bottom:10px;height:96px;border-radius:34px;background:rgba(210,210,220,.22);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);display:flex;justify-content:space-around;align-items:center;padding:0 10px 4px}
.dock .app{width:auto}.dock .n{display:none}

/* app window */
.win{z-index:40;background:#000;transform:scale(.25);opacity:0;border-radius:40px;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .3s,border-radius .42s;display:flex;flex-direction:column}
.win.open{transform:none;opacity:1;border-radius:0}
.win.lt{background:#fff;color:#000}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:inherit;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.page.in{transform:none}
.page.back{transform:translateX(-30%)}
.nb{flex:none;padding:54px 8px 0;display:flex;align-items:center;min-height:98px;position:relative}
.nb .bk{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;padding:8px}
.nb .bk svg{width:12px;height:21px}
.nb .ti{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:17px;font-weight:600;pointer-events:none}
.nb .ra{margin-left:auto;color:var(--blue);padding:8px 10px;font-size:17px}
.lt .nb .bk,.lt .nb .ra{color:var(--blue)}
.lg{font-size:34px;font-weight:700;letter-spacing:.005em;padding:2px 16px 8px}
.cont{flex:1;overflow-y:auto;padding-bottom:50px;-webkit-overflow-scrolling:touch}
.grp{margin:8px 16px 0;background:var(--g1);border-radius:10px;overflow:hidden}
.lt .grp{background:#fff}
.gh{font-size:13px;color:var(--lb2);text-transform:uppercase;margin:22px 32px 6px;letter-spacing:-.005em}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;cursor:pointer}
.cell:not(:last-child):after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.cell.ic:not(:last-child):after{left:60px}
.cell .k{flex:1;font-size:17px}
.cell .v{color:var(--lb2);font-size:17px}
.cell .chev{color:var(--lb3);font-size:17px;margin-left:4px}
.sq{flex:none;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.sq svg{width:18px;height:18px}
.ft{font-size:13px;color:var(--lb2);margin:6px 32px 0;line-height:1.35}

/* kakao */
.kk{background:#fff;color:#000}
.kk .khd{padding:58px 20px 6px;display:flex;align-items:center;justify-content:space-between}
.kk .khd b{font-size:22px;font-weight:700}
.kk .khd span{display:flex;gap:18px;color:#333}
.krow{display:flex;align-items:center;gap:13px;padding:9px 20px;cursor:pointer}
.krow:active{background:#f2f2f2}
.kav{flex:none;width:48px;height:48px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;overflow:hidden}
.kav img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.krow .c{flex:1;min-width:0}
.krow .c b{display:block;font-size:15px;font-weight:600}
.krow .c b em{font-style:normal;color:#999;font-weight:400;font-size:13px;margin-left:4px}
.krow .c span{display:block;font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.krow .r{flex:none;text-align:right;font-size:11px;color:#aaa}
.krow .r i{display:inline-block;font-style:normal;background:#ff5a3c;color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:1px 6px;margin-top:5px}
.ktab{position:absolute;left:0;right:0;bottom:0;height:84px;border-top:.5px solid #ddd;background:#fafafa;display:flex;justify-content:space-around;padding-top:10px}
.ktab span{width:26px;height:26px;border-radius:6px;background:#ccc}
.ktab span.on{background:#000}
.room{background:#b2c7da;color:#000}
.room .nb{background:rgba(178,199,218,.94)}
.room .nb .bk{color:#000}
.room .cont{padding:8px 10px 70px}
.dt{text-align:center;margin:10px 0 12px}
.dt span{display:inline-block;background:rgba(0,0,0,.15);color:#fff;font-size:12px;border-radius:12px;padding:3px 12px}
.m{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
.m .kav{width:40px;height:40px;border-radius:15px;font-size:12px}
.m .nm{font-size:12px;color:#3d4b57;margin-bottom:3px}
.m .bw{display:flex;align-items:flex-end;gap:5px}
.m .bu{background:#fff;border-radius:4px 16px 16px 16px;padding:8px 11px;font-size:15px;line-height:1.4;max-width:240px;word-break:keep-all}
.m .tm{font-size:10px;color:#56636e;white-space:nowrap}
.m .tm i{display:block;font-style:normal;color:#d9a400;font-weight:700;font-size:11px;text-align:right}
.m.me{justify-content:flex-end}
.m.me .bu{background:#fee500;border-radius:16px 4px 16px 16px}
.m.me .bw{flex-direction:row-reverse}
.m.cont2{margin-left:48px;margin-top:-3px}
.pic{width:160px;height:190px;border-radius:12px;background:linear-gradient(160deg,#f3d9b5,#c99a6a);display:flex;align-items:flex-end;justify-content:center;font-size:56px;padding-bottom:20px}
.kin{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:8px 10px 30px;display:flex;align-items:center;gap:10px;color:#aaa}
.kin div{flex:1;background:#f3f3f3;border-radius:20px;padding:9px 14px;font-size:15px}

/* phone app */
.seg{display:flex;margin:4px auto 6px;width:220px;background:#2c2c2e;border-radius:9px;padding:2px}
.seg span{flex:1;text-align:center;font-size:13px;font-weight:600;padding:5px 0;border-radius:7px}
.seg span.on{background:#636366}
.call{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 16px;position:relative}
.call:after{content:"";position:absolute;left:52px;right:0;bottom:0;height:.5px;background:var(--sep)}
.call .ph{flex:none;width:26px;color:var(--lb3)}
.call .c{flex:1;min-width:0}
.call .c b{display:block;font-size:17px;font-weight:600}
.call .c span{display:block;font-size:14px;color:var(--lb2)}
.call .r{font-size:15px;color:var(--lb2);display:flex;align-items:center;gap:10px}
.call .r i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.red{color:var(--red)!important}
.tabs{flex:none;display:flex;justify-content:space-around;padding:8px 0 30px;border-top:.5px solid var(--sep);background:rgba(20,20,22,.94)}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#8e8e93}
.tabs div.on{color:var(--blue)}
.tabs i{width:26px;height:24px;border-radius:6px;background:currentColor;opacity:.9;display:block;-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat}

/* contact card */
.cc{text-align:center;padding:8px 16px 4px}
.cc .pf{width:104px;height:104px;border-radius:50%;overflow:hidden;margin:0 auto 10px}
.cc .pf img{width:100%;height:100%;object-fit:cover;object-position:center 12%}
.cc b{display:block;font-size:30px;font-weight:600}
.cc span{font-size:15px;color:var(--lb2)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 16px 0}
.acts div{background:var(--g1);border-radius:10px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--blue);font-size:11px}
.acts svg{width:22px;height:22px}
.fv{display:block;padding:9px 16px;position:relative}
.fv:not(:last-child):after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.fv span{display:block;font-size:14px;color:var(--lb)}
.fv b{display:block;font-size:17px;font-weight:400;color:var(--blue)}
.fv b.w{color:var(--lb)}

/* notes */
.nts{background:#000}
.nts .nb .bk,.nts .nb .ra{color:#e5b21b}
.nrow{padding:11px 16px;position:relative;cursor:pointer}
.nrow:not(:last-child):after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.nrow b{display:block;font-size:17px;font-weight:600}
.nrow span{display:block;font-size:15px;color:var(--lb2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow span em{font-style:normal;color:var(--lb);margin-right:8px}
.nbody{padding:4px 20px 60px}
.nbody .ndt{text-align:center;font-size:13px;color:var(--lb2);margin-bottom:16px}
.nbody h2{font-size:28px;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
.nbody p{font-size:17px;line-height:1.55;margin-bottom:6px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:17px;line-height:1.45;margin-bottom:8px}
.chk i{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid #6e6e73;margin-top:1px}
.chk.dn i{background:#e5b21b;border-color:#e5b21b;position:relative}
.chk.dn i:after{content:"";position:absolute;left:6px;top:3px;width:6px;height:11px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk.dn span{color:var(--lb2);text-decoration:line-through}

/* photos */
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.pg div{aspect-ratio:1/1;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:34px}
.pg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.pg .vid:after{content:attr(data-d);position:absolute;right:4px;bottom:3px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pcnt{text-align:center;padding:16px 0 4px}
.pcnt b{display:block;font-size:15px;font-weight:600}
.pcnt span{font-size:13px;color:var(--lb2)}
.ph-hd{display:flex;justify-content:space-between;align-items:flex-end;padding:56px 16px 10px}
.ph-hd b{font-size:34px;font-weight:700}
.ph-hd span{font-size:15px;color:var(--lb2)}
#viewer{z-index:75;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .25s}
#viewer img{max-width:100%;max-height:78%}
#viewer .vb{position:absolute;top:54px;left:12px;color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px}
#viewer .vi{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:13px;color:var(--lb2)}

/* clock */
.alm{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;position:relative}
.alm:after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.alm b{display:block;font-size:56px;font-weight:200;line-height:1;letter-spacing:-.02em;font-feature-settings:"tnum"}
.alm b small{font-size:30px;font-weight:300;margin-right:2px}
.alm span{display:block;font-size:15px;margin-top:2px}
.alm.dim b,.alm.dim span{color:var(--lb2)}
.tg{flex:none;width:51px;height:31px;border-radius:16px;background:var(--green);position:relative;transition:background .2s}
.tg:after{content:"";position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .2s}
.tg.o{background:#39393d}.tg.o:after{left:2px}

/* safari */
.sfr{background:#1c1c1e}
.sfh{padding:58px 16px 8px}
.sfh b{font-size:28px;font-weight:700}
